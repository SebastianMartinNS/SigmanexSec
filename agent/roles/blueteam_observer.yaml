id: blueteam_observer
name: Blue Team Observer
persona_prompt_path: agent/prompts/roles/blueteam_observer.md
allowed_tools:
  - osquery_query
  - sigma_match
  - yara_scan
  - timeline_review
  - log_analysis
  - detection_coverage_check
  - search_archival_memory
  - read_core_memory
  - record_finding
  - get_engagement
denied_tools:
  - "*exploit*"
  - "*brute*"
  - "*payload*"
  - "*shell*"
  - "*dump*"
allowed_phases:
  - reconnaissance
  - scanning
  - exploitation
  - post_exploitation
  - reporting
can_handoff_to:
  - to: reporter
    when: when detection coverage analysis is complete
  - to: planner
    when: when defensive baseline reveals out-of-scope assumptions
capability_guards:
  requires_human_approval: false
  max_tool_calls_per_step: 6
