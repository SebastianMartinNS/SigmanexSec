        type: boolean
        default: true
      resource_script:
        type: string
        default: ''
    required: []
  argv_template:
  - '{{?quiet}}-q{{/quiet}}'
  - '{{?resource_script}}-r{{/resource_script}}'
  - '{{?resource_script}}{{resource_script}}{{/resource_script}}'
  scope_arg: null
  parser: raw
  when: Multi-step exploitation requiring stateful module configuration.
  how_notes: ALWAYS use `setg LHOST` etc. carefully; avoid dangerous payloads on production. `exit -y`
    to quit.
