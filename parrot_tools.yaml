- name: sherlock_run
  binary: sherlock
  category: osint
  description: Find usernames across 400+ social networks.
  requires_sudo: false
  default_timeout_seconds: 900
  mitre:
  - T1589.001
  risk_level: low
  interactive: false
  args_schema:
    type: object
    properties:
      username:
        type: string
      timeout:
        type: integer
        default: 10
    required:
    - username
  argv_template:
  - --print-found
  - --no-color
  - --timeout
  - '{{timeout}}'
  - '{{username}}'
  scope_arg: username
  parser: raw
  when: You need to discover where an authorized username is registered.
  why: Sherlock checks ~400 sites with regex/HTTP heuristics; passive recon.
  how_notes: Output goes to stdout; we use --print-found to skip negatives.
  references:
  - https://github.com/sherlock-project/sherlock
  examples:
  - username: octocat
  pii: true
  install_via: pipx

