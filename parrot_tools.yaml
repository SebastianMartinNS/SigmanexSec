- name: httpx_probe
  binary: httpx
  category: recon
  description: Probe HTTP/HTTPS hosts for status, title, tech, TLS info.
  requires_sudo: false
  default_timeout_seconds: 600
  mitre:
  - T1595.002
  risk_level: low
  interactive: false
  args_schema:
    type: object
    properties:
      input_list:
        type: string
        description: file with hosts (one per line)
      single_target:
        type: string
        description: probe a single URL/host instead
      status_code:
        type: boolean
        default: true
      title:
        type: boolean
        default: true
      tech_detect:
        type: boolean
        default: true
      follow_redirects:
        type: boolean
        default: true
    required: []
  argv_template:
  - '{{?input_list}}-l{{/input_list}}'
  - '{{?input_list}}{{input_list}}{{/input_list}}'
  - '{{?single_target}}-u{{/single_target}}'
  - '{{?single_target}}{{single_target}}{{/single_target}}'
  - '{{?status_code}}-status-code{{/status_code}}'
  - '{{?title}}-title{{/title}}'
  - '{{?tech_detect}}-tech-detect{{/tech_detect}}'
  - '{{?follow_redirects}}-fr{{/follow_redirects}}'
  - -json
  - -silent
  scope_arg: single_target
  parser: jsonl
  when: You have a list of hosts/subdomains and need to know which speak HTTP and what they serve.
  why: Concurrent probes, JSON output, integrates with the rest of ProjectDiscovery suite.
  references:
  - https://github.com/projectdiscovery/httpx

