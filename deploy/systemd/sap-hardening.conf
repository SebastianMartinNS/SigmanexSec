# Common hardening drop-in for every SAP systemd service.
# Each service unit references this via `Include=/etc/sap/sap-hardening.conf`
# OR via a .d/ drop-in. We default to inlining via @-substitution at install
# time so end users only need a single `systemctl daemon-reload`.

[Service]
# Identity ─ run as a dedicated unprivileged user with stable state.
User=sap
Group=sap
UMask=0077

# Filesystem isolation.
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectProc=invisible
ProcSubset=pid

# Process isolation.
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
PrivateUsers=yes
RemoveIPC=yes

# Capability minimisation.
CapabilityBoundingSet=
AmbientCapabilities=

# Memory hygiene (also enforced inside Python via core.process_hardening).
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @debug @cpu-emulation @obsolete @raw-io @reboot @swap @mount @clock

# Network policy ─ loopback-only by default. Per-unit overrides may relax
# this (only the LLM and MCP services need TCP at all; sudo broker is
# AF_UNIX only).
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=any
IPAddressAllow=localhost
IPAddressAllow=127.0.0.0/8
IPAddressAllow=::1/128

# Resource ceilings.
TasksMax=512
LimitNOFILE=4096
LimitCORE=0
LimitNPROC=512

# Logging.
StandardOutput=journal
StandardError=journal
SyslogIdentifier=%n

# State directory ─ /var/lib/sap; state files inherit 0700.
StateDirectory=sap
StateDirectoryMode=0700
RuntimeDirectory=sap
RuntimeDirectoryMode=0700
LogsDirectory=sap
LogsDirectoryMode=0700
ConfigurationDirectory=sap
ConfigurationDirectoryMode=0700

# Working directory and env.
WorkingDirectory=/opt/sap
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=PYTHONUNBUFFERED=1
Environment=SAP_STATE_DIR=/var/lib/sap
Environment=XDG_STATE_HOME=/var/lib/sap
Environment=XDG_CONFIG_HOME=/etc/sap

# Restart policy.
Restart=on-failure
RestartSec=5s
TimeoutStopSec=30s
