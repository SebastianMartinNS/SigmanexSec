name: SAP — security checks (P1.8)

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Re-scan every Monday so CVEs published mid-week surface quickly.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    name: pip-audit + bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime + tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit bandit safety

      - name: pip-audit (PyPI advisories)
        run: |
          pip-audit -r requirements.txt --strict || (echo "::error::pip-audit found vulnerabilities" && exit 1)

      - name: bandit (static analysis)
        run: |
          bandit -ll -ii \
            -r core sap_dashboard agent mcp_servers \
            --exclude llama.cpp,build,sap_dashboard/frontend \
            -f json -o bandit.json
        continue-on-error: false

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30

  pytest:
    name: pytest hardening suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Run hardening tests
        run: |
          python -m pytest tests/test_p0_hardening_auth.py \
                            tests/test_p1_rate_limit.py -v
