name: SAP — Weekly supply-chain audit

# Continuous lint/scan/test responsibilities live in ci.yml. This workflow
# only re-scans pinned dependencies on a schedule so CVEs published mid-week
# surface within hours instead of waiting for the next PR.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-cve-rescan:
    name: pip-audit weekly re-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pip-audit
        run: pip install 'pip-audit>=2.7.0'
      - name: Re-audit hash-locked dependencies
        run: |
          pip-audit --strict --requirement requirements.lock \
            --format json --output pip-audit-report.json || \
            (echo "::error::pip-audit found new CVEs; review pip-audit-report.json" && exit 1)
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90
